<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#060e20; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="48" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="-0.5">WHY PLAYONMEET WAS BUILT: ZERO-INSTALL BROWSER ARCHITECTURE</text>
  <text x="480" y="74" fill="#bcc7de" font-size="13" text-anchor="middle" fill-opacity="0.7">Replacing Heavy App Downloads &amp; Clunky Screen Shares with Peer-to-Peer Browser Tabs</text>

  <!-- Comparison Left: Traditional Video Meeting Games -->
  <g transform="translate(40, 105)">
    <rect width="400" height="340" rx="16" fill="url(#cardGrad)" stroke="#ff5555" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#ff5555" fill-opacity="0.1"/>
    <text x="38" y="44" fill="#ff7777" font-size="16" text-anchor="middle">✕</text>
    <text x="68" y="38" fill="#ffffff" font-size="15" font-weight="700">The Broken Status Quo</text>
    <text x="68" y="52" fill="#bcc7de" font-size="11" fill-opacity="0.6">Passive Screen Shares &amp; Heavy Installs</text>

    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="360" height="50" rx="10" fill="#0b1326" stroke="#464555" stroke-opacity="0.5"/>
      <text x="16" y="22" fill="#ff8888" font-size="12" font-weight="700">Friction 1: Mandatory Signups &amp; Software Installs</text>
      <text x="16" y="38" fill="#bcc7de" font-size="10.5" fill-opacity="0.7">Blocked by corporate IT firewalls and IT policies.</text>

      <rect x="0" y="62" width="360" height="50" rx="10" fill="#0b1326" stroke="#464555" stroke-opacity="0.5"/>
      <text x="16" y="84" fill="#ff8888" font-size="12" font-weight="700">Friction 2: Passive Screen Sharing Fatigue</text>
      <text x="16" y="100" fill="#bcc7de" font-size="10.5" fill-opacity="0.7">One person plays while everyone else stares passively.</text>

      <rect x="0" y="124" width="360" height="50" rx="10" fill="#0b1326" stroke="#464555" stroke-opacity="0.5"/>
      <text x="16" y="146" fill="#ff8888" font-size="12" font-weight="700">Friction 3: Cloud Video Ingestion &amp; Privacy Hazards</text>
      <text x="16" y="162" fill="#bcc7de" font-size="10.5" fill-opacity="0.7">Streaming camera feeds to external cloud GPUs.</text>
    </g>

    <text x="20" y="310" fill="#ff8888" font-size="12" font-weight="700">Result: High drop-off, awkward silence, fatigue.</text>
  </g>

  <!-- Comparison Right: PlayOnMeet Approach -->
  <g transform="translate(520, 105)">
    <rect width="400" height="340" rx="16" fill="url(#cardGrad)" stroke="#c0c1ff" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#5d60eb" fill-opacity="0.2"/>
    <text x="38" y="44" fill="#c0c1ff" font-size="16" text-anchor="middle">✓</text>
    <text x="68" y="38" fill="#ffffff" font-size="15" font-weight="700">The PlayOnMeet Way</text>
    <text x="68" y="52" fill="#c0c1ff" font-size="11" font-weight="600">Zero-Friction, Browser-Native, Embodied</text>

    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="360" height="50" rx="10" fill="#0b1326" stroke="#5d60eb" stroke-opacity="0.4"/>
      <text x="16" y="22" fill="#c0c1ff" font-size="12" font-weight="700">Solution 1: Zero Accounts, 5-Letter Room Codes</text>
      <text x="16" y="38" fill="#bcc7de" font-size="10.5" fill-opacity="0.7">Anyone clicks a link and joins in 3 seconds flat.</text>

      <rect x="0" y="62" width="360" height="50" rx="10" fill="#0b1326" stroke="#5d60eb" stroke-opacity="0.4"/>
      <text x="16" y="84" fill="#c0c1ff" font-size="12" font-weight="700">Solution 2: Bare-Hand Physical Interactivity</text>
      <text x="16" y="100" fill="#bcc7de" font-size="10.5" fill-opacity="0.7">Air drawing &amp; grid gestures wake up the call.</text>

      <rect x="0" y="124" width="360" height="50" rx="10" fill="#0b1326" stroke="#5d60eb" stroke-opacity="0.4"/>
      <text x="16" y="146" fill="#c0c1ff" font-size="12" font-weight="700">Solution 3: Client-Side WebAssembly &amp; WebRTC</text>
      <text x="16" y="162" fill="#bcc7de" font-size="10.5" fill-opacity="0.7">Frames stay on device; direct P2P data channels.</text>
    </g>

    <text x="20" y="310" fill="#c0c1ff" font-size="12" font-weight="700">Result: Organic laughter, genuine connection in 5 mins.</text>
  </g>
</svg>
