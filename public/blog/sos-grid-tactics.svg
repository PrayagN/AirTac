<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#060e20; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c1ff"/>
      <stop offset="100%" stop-color="#ddb7ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="48" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="-0.5">SOS &amp; SOCIAL XOX GAME THEORY &amp; GRID TACTICS</text>
  <text x="480" y="74" fill="#bcc7de" font-size="13" text-anchor="middle" fill-opacity="0.7">Mathematical Parity, Trap Geometries, and Gesture State Synchronization in PlayOnMeet</text>

  <!-- Panel 1: The SOS Trap Setup -->
  <g transform="translate(40, 105)">
    <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#c0c1ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="700">1. S-O-S Trap Formation</text>
    <text x="24" y="54" fill="#bcc7de" font-size="11" fill-opacity="0.6">Defensive Baiting in n×n Grids</text>

    <!-- 3x3 Grid Graphic -->
    <g transform="translate(45, 75)">
      <!-- Grid lines -->
      <line x1="60" y1="0" x2="60" y2="180" stroke="#464555" stroke-width="3"/>
      <line x1="120" y1="0" x2="120" y2="180" stroke="#464555" stroke-width="3"/>
      <line x1="0" y1="60" x2="180" y2="60" stroke="#464555" stroke-width="3"/>
      <line x1="0" y1="120" x2="180" y2="120" stroke="#464555" stroke-width="3"/>
      
      <!-- Cells -->
      <text x="30" y="42" fill="#c0c1ff" font-size="28" font-weight="900" text-anchor="middle">S</text>
      <!-- Middle top empty -->
      <text x="150" y="42" fill="#c0c1ff" font-size="28" font-weight="900" text-anchor="middle">S</text>
      <rect x="62" y="2" width="56" height="56" rx="8" fill="#ddb7ff" fill-opacity="0.15" stroke="#ddb7ff" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="90" y="38" fill="#ddb7ff" font-size="16" font-weight="800" text-anchor="middle">?</text>

      <text x="30" y="102" fill="#bcc7de" font-size="24" font-weight="700" text-anchor="middle" fill-opacity="0.3">·</text>
      <text x="90" y="102" fill="#ddb7ff" font-size="28" font-weight="900" text-anchor="middle">O</text>
      <text x="150" y="102" fill="#bcc7de" font-size="24" font-weight="700" text-anchor="middle" fill-opacity="0.3">·</text>

      <text x="30" y="162" fill="#c0c1ff" font-size="28" font-weight="900" text-anchor="middle">S</text>
      <text x="90" y="162" fill="#bcc7de" font-size="24" font-weight="700" text-anchor="middle" fill-opacity="0.3">·</text>
      <text x="150" y="162" fill="#c0c1ff" font-size="28" font-weight="900" text-anchor="middle">S</text>

      <!-- Diagonal Winning Vector Indicator -->
      <line x1="10" y1="10" x2="170" y2="170" stroke="#ddb7ff" stroke-width="3" stroke-opacity="0.7"/>
    </g>

    <text x="24" y="280" fill="#c0c1ff" font-size="11.5" font-weight="700">The S-[ ]-S Vulnerability</text>
    <text x="24" y="298" fill="#bcc7de" font-size="10.5" fill-opacity="0.8">• Placing an 'O' creates instant point</text>
    <text x="24" y="314" fill="#bcc7de" font-size="10.5" fill-opacity="0.8">• Scorer earns bonus consecutive turn</text>
  </g>

  <!-- Panel 2: Decision Trees & Parity -->
  <g transform="translate(345, 105)">
    <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#c0c1ff" stroke-opacity="0.4" stroke-width="2"/>
    <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="700">2. Grid Parity &amp; Minimax</text>
    <text x="24" y="54" fill="#bcc7de" font-size="11" fill-opacity="0.6">Game State Transitions &amp; Timing</text>

    <!-- Mini Decision Tree -->
    <g transform="translate(25, 75)">
      <rect x="60" y="0" width="100" height="32" rx="8" fill="#5d60eb" fill-opacity="0.3" stroke="#c0c1ff" stroke-width="1"/>
      <text x="110" y="20" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Turn n: Player A</text>

      <!-- Branches -->
      <line x1="85" y1="32" x2="40" y2="70" stroke="#c0c1ff" stroke-width="1.5"/>
      <line x1="135" y1="32" x2="180" y2="70" stroke="#c0c1ff" stroke-width="1.5"/>

      <!-- Node Left: Safe Perimeter 'S' -->
      <rect x="0" y="70" width="95" height="44" rx="8" fill="#0b1326" stroke="#464555"/>
      <text x="47" y="88" fill="#c0c1ff" font-size="10.5" font-weight="700" text-anchor="middle">Corner 'S'</text>
      <text x="47" y="103" fill="#bcc7de" font-size="9.5" text-anchor="middle" fill-opacity="0.7">Zero Giveaway</text>

      <!-- Node Right: Premature 'O' -->
      <rect x="130" y="70" width="95" height="44" rx="8" fill="#0b1326" stroke="#ff5555" stroke-opacity="0.5"/>
      <text x="177" y="88" fill="#ff8888" font-size="10.5" font-weight="700" text-anchor="middle">Central 'O'</text>
      <text x="177" y="103" fill="#bcc7de" font-size="9.5" text-anchor="middle" fill-opacity="0.7">High Giveaway</text>

      <!-- Second tier cascade -->
      <line x1="47" y1="114" x2="47" y2="145" stroke="#c0c1ff" stroke-width="1.5" stroke-dasharray="2 2"/>
      <rect x="0" y="145" width="95" height="26" rx="6" fill="#171f33"/>
      <text x="47" y="162" fill="#c0c1ff" font-size="10" font-weight="600" text-anchor="middle">Parity Preserved</text>

      <line x1="177" y1="114" x2="177" y2="145" stroke="#ff5555" stroke-width="1.5" stroke-dasharray="2 2"/>
      <rect x="130" y="145" width="95" height="26" rx="6" fill="#171f33"/>
      <text x="177" y="162" fill="#ff8888" font-size="10" font-weight="600" text-anchor="middle">Streak Cascade</text>
    </g>

    <text x="24" y="280" fill="#c0c1ff" font-size="11.5" font-weight="700">Odd vs Even Board Parity</text>
    <text x="24" y="298" fill="#bcc7de" font-size="10.5" fill-opacity="0.8">• 3×3 (9 squares) forces odd parity</text>
    <text x="24" y="314" fill="#bcc7de" font-size="10.5" fill-opacity="0.8">• Last-mover wins remaining edges</text>
  </g>

  <!-- Panel 3: P2P Synchronization Loop -->
  <g transform="translate(650, 105)">
    <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#c0c1ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="700">3. WebRTC Move Consensus</text>
    <text x="24" y="54" fill="#bcc7de" font-size="11" fill-opacity="0.6">Optimistic Local UI + P2P Sync</text>

    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="230" height="42" rx="10" fill="#0b1326" stroke="#464555"/>
      <text x="16" y="26" fill="#ffffff" font-size="11" font-weight="700">1. Pinch Gesture Detected</text>
      
      <rect x="0" y="54" width="230" height="42" rx="10" fill="#5d60eb" fill-opacity="0.2" stroke="#c0c1ff" stroke-width="1"/>
      <text x="16" y="80" fill="#c0c1ff" font-size="11" font-weight="700">2. Optimistic Cell Lock</text>

      <rect x="0" y="108" width="230" height="42" rx="10" fill="#0b1326" stroke="#464555"/>
      <text x="16" y="134" fill="#ddb7ff" font-size="11" font-weight="700">3. PeerJS Data Packet Sent</text>
      
      <rect x="0" y="162" width="230" height="42" rx="10" fill="#171f33" stroke="#464555"/>
      <text x="16" y="188" fill="#ffffff" font-size="11" font-weight="700">4. Winning Vector Highlighted</text>
    </g>

    <text x="24" y="295" fill="#bcc7de" font-size="11" font-weight="600">Zero Server Latency:</text>
    <text x="24" y="315" fill="#c0c1ff" font-size="10.5">• Sub-30ms round-trip over WebRTC</text>
  </g>
</svg>
