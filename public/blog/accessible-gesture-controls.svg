<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#060e20; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="48" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="-0.5">PLAYONMEET INCLUSIVE WEBCAM GESTURE ARCHITECTURE</text>
  <text x="480" y="74" fill="#bcc7de" font-size="13" text-anchor="middle" fill-opacity="0.7">Multi-Modal Input Fallbacks, Adaptive Thresholds &amp; Low-Light Robustness</text>

  <!-- Pillar 1: Lighting & Hand Geometry -->
  <g transform="translate(40, 105)">
    <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#c0c1ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="700">1. Adaptive Hand Tracking</text>
    <text x="24" y="54" fill="#bcc7de" font-size="11" fill-opacity="0.6">Environment &amp; Ergonomics</text>

    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="230" height="46" rx="8" fill="#0b1326" stroke="#464555"/>
      <text x="14" y="20" fill="#c0c1ff" font-size="11" font-weight="700">Lighting Invariance</text>
      <text x="14" y="36" fill="#bcc7de" font-size="10" fill-opacity="0.7">Normalizes skin tone &amp; backlight contrast.</text>

      <rect x="0" y="56" width="230" height="46" rx="8" fill="#0b1326" stroke="#464555"/>
      <text x="14" y="76" fill="#c0c1ff" font-size="11" font-weight="700">Hand Distance Scaling</text>
      <text x="14" y="92" fill="#bcc7de" font-size="10" fill-opacity="0.7">Pinch threshold scales with palm width.</text>

      <rect x="0" y="112" width="230" height="46" rx="8" fill="#0b1326" stroke="#464555"/>
      <text x="14" y="132" fill="#c0c1ff" font-size="11" font-weight="700">Single-Hand Parity</text>
      <text x="14" y="148" fill="#bcc7de" font-size="10" fill-opacity="0.7">Fully playable using either left or right hand.</text>
    </g>

    <text x="24" y="280" fill="#c0c1ff" font-size="11.5" font-weight="700">Key Engineering Decision:</text>
    <text x="24" y="300" fill="#bcc7de" font-size="10.5" fill-opacity="0.8">• Dynamic distance thresholds prevent false-clicks when moving toward camera.</text>
  </g>

  <!-- Pillar 2: Hardware Efficiency -->
  <g transform="translate(345, 105)">
    <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#c0c1ff" stroke-opacity="0.4" stroke-width="2"/>
    <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="700">2. Low-Resource Optimization</text>
    <text x="24" y="54" fill="#bcc7de" font-size="11" fill-opacity="0.6">Battery &amp; CPU Preservation</text>

    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="230" height="46" rx="8" fill="#0b1326" stroke="#5d60eb" stroke-opacity="0.5"/>
      <text x="14" y="20" fill="#c0c1ff" font-size="11" font-weight="700">WASM SIMD Acceleration</text>
      <text x="14" y="36" fill="#bcc7de" font-size="10" fill-opacity="0.7">Vectorized tensors reduce CPU usage by 40%.</text>

      <rect x="0" y="56" width="230" height="46" rx="8" fill="#0b1326" stroke="#5d60eb" stroke-opacity="0.5"/>
      <text x="14" y="76" fill="#c0c1ff" font-size="11" font-weight="700">Frame Decoupling</text>
      <text x="14" y="92" fill="#bcc7de" font-size="10" fill-opacity="0.7">Canvas renders at 60 FPS while CV runs at 30.</text>

      <rect x="0" y="112" width="230" height="46" rx="8" fill="#0b1326" stroke="#5d60eb" stroke-opacity="0.5"/>
      <text x="14" y="132" fill="#c0c1ff" font-size="11" font-weight="700">Zero Memory Leaks</text>
      <text x="14" y="148" fill="#bcc7de" font-size="10" fill-opacity="0.7">Strict buffer recycling in JS garbage collector.</text>
    </g>

    <text x="24" y="280" fill="#c0c1ff" font-size="11.5" font-weight="700">Tested on Low-End Laptops:</text>
    <text x="24" y="300" fill="#bcc7de" font-size="10.5" fill-opacity="0.8">• Stable 30+ FPS without causing thermal throttling or fan noise during calls.</text>
  </g>

  <!-- Pillar 3: Multi-Modal Fallbacks -->
  <g transform="translate(650, 105)">
    <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#c0c1ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="700">3. Non-Camera Fallbacks</text>
    <text x="24" y="54" fill="#bcc7de" font-size="11" fill-opacity="0.6">Universal Input Support</text>

    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="230" height="46" rx="8" fill="#0b1326" stroke="#464555"/>
      <text x="14" y="20" fill="#ddb7ff" font-size="11" font-weight="700">Mouse &amp; Trackpad Parity</text>
      <text x="14" y="36" fill="#bcc7de" font-size="10" fill-opacity="0.7">Click-and-drag mirrors air drawing exactly.</text>

      <rect x="0" y="56" width="230" height="46" rx="8" fill="#0b1326" stroke="#464555"/>
      <text x="14" y="76" fill="#ddb7ff" font-size="11" font-weight="700">Keyboard Navigation</text>
      <text x="14" y="92" fill="#bcc7de" font-size="10" fill-opacity="0.7">Arrow keys &amp; Spacebar for full SOS gameplay.</text>

      <rect x="0" y="112" width="230" height="46" rx="8" fill="#0b1326" stroke="#464555"/>
      <text x="14" y="132" fill="#ddb7ff" font-size="11" font-weight="700">Screen-Reader Labeling</text>
      <text x="14" y="148" fill="#bcc7de" font-size="10" fill-opacity="0.7">ARIA live announcements on turn updates.</text>
    </g>

    <text x="24" y="280" fill="#ddb7ff" font-size="11.5" font-weight="700">Nobody Gets Left Out:</text>
    <text x="24" y="300" fill="#bcc7de" font-size="10.5" fill-opacity="0.8">• Players without webcams can participate alongside gesture players seamlessly.</text>
  </g>
</svg>
